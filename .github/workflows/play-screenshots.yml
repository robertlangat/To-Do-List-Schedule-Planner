name: Google Play screenshots

# Captures phone screenshots from an Android emulator in screenshot mode (demo data, no ads),
# adds captions, and publishes them to the "play-assets" branch and release (1080x1920, 9:16).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/src/**", "marketing/**", ".github/workflows/play-screenshots.yml"]

concurrency:
  group: play-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash marketing/capture-android.sh
      - name: Add captions
        run: |
          python3 -m pip install --quiet pillow
          python3 marketing/compose.py store/raw store/framed
          cp marketing/play/*.png store/
          python3 -c "from PIL import Image; import glob; [print(f, Image.open(f).size) for f in sorted(glob.glob('store/**/*.png', recursive=True))]"
          (cd store && zip -qr ../play-store-assets.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-assets
          path: store/
      - name: Publish (play-assets branch + release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete play-store-assets --cleanup-tag --yes || true
          gh release create play-store-assets play-store-assets.zip --prerelease --target "$GITHUB_SHA" \
            --title "Google Play assets (screenshots, icon, feature graphic)" \
            --notes "Phone screenshots 1080x1920 (9:16), captioned (framed/phone) and plain (raw/phone); 512x512 icon; 1024x500 feature graphic. Built from ${GITHUB_SHA::7}."
          cd store
          git init -q -b play-assets
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Play assets from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" play-assets
