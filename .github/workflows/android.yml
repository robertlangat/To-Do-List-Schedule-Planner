name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core + app)
        run: ./gradlew --stacktrace :core:test :app:testDebugUnitTest

      - name: Build debug APKs (phone + Wear OS)
        run: ./gradlew --stacktrace :app:assembleDebug :wear:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk

      - name: Publish debug APKs to the "debug-latest" release (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/todo-planner-phone-debug.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk release/todo-planner-wear-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest release/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug APKs built from ${GITHUB_SHA::7}. Install todo-planner-phone-debug.apk on your phone (allow installs from unknown sources). The Wear APK is for a paired Wear OS watch."

      - name: Lint
        run: ./gradlew --stacktrace :app:lintDebug :wear:lintDebug

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            wear/build/reports/
            core/build/reports/

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: backend
